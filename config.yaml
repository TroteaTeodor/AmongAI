game:
  mode: "watch_ai"            # "watch_ai", "play_with_ai", "chat_mode"
  num_players: 10
  num_impostors: 2
  discussion_time: 30
  voting_time: 30
  kill_cooldown: 15
  sabotage_cooldown: 15
  task_count: 8
  game_speed: 1.0

ai:
  decision_interval: 1.0      # FASTER: 1s instead of 3s
  vision_radius: 500
  vision_radius_dark: 150
  fallback_enabled: true
  llm_timeout: 4.0            # Reduced timeout for speed
  max_concurrent_calls: 5
  task_duration_min: 2.0
  task_duration_max: 5.0
  idle_after_task_min: 0.5
  idle_after_task_max: 1.5

  default_provider: "openrouter"
  default_model: "google/gemini-2.0-flash-001"    # Standard Flash (very cheap/free tier)

providers:
  openrouter:
    api_key: "${OPENROUTER_API_KEY}"
    model: "google/gemini-2.0-flash-001"
    
  # Other providers kept for reference
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    model: "claude-3-5-sonnet-20241022"
  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4o-mini"

players:
  - colour: "Red"
    provider: "openrouter"
    model: "google/gemini-2.0-flash-001"
    personality:
      name: "Commander"
      aggression: 0.6
      suspicion_tendency: 0.7
      chattiness: 0.8
      cooperation: 0.5
      deception_skill: 0.7
      risk_tolerance: 0.6
      speaking_style: "Direct and authoritative. Uses short declarative sentences."

  - colour: "Blue"
    provider: "openrouter"
    model: "meta-llama/llama-3-8b-instruct:free"
    personality:
      name: "Detective"
      aggression: 0.3
      suspicion_tendency: 0.9
      chattiness: 0.7
      cooperation: 0.8
      deception_skill: 0.4
      risk_tolerance: 0.3
      speaking_style: "Analytical and methodical. Often asks probing questions."

  - colour: "Orange"
    provider: "openrouter"
    model: "microsoft/phi-3-mini-128k-instruct:free"
    personality:
      name: "Socialite"
      aggression: 0.4
      suspicion_tendency: 0.5
      chattiness: 0.9
      cooperation: 0.7
      deception_skill: 0.6
      risk_tolerance: 0.5
      speaking_style: "Friendly and chatty. Tries to build consensus."

  - colour: "Yellow"
    provider: "openrouter"
    model: "mistralai/mistral-7b-instruct:free"
    personality:
      name: "Strategist"
      aggression: 0.5
      suspicion_tendency: 0.8
      chattiness: 0.5
      cooperation: 0.6
      deception_skill: 0.8
      risk_tolerance: 0.4
      speaking_style: "Calculated and precise. Focuses on game mechanics."

  - colour: "Green"
    provider: "openrouter"
    model: "google/gemini-2.0-flash-001" # Switching back to stable flash if free one fails
    personality:
      name: "Wildcard"
      aggression: 0.8
      suspicion_tendency: 0.4
      chattiness: 0.6
      cooperation: 0.3
      deception_skill: 0.5
      risk_tolerance: 0.9
      speaking_style: "Unpredictable and energetic. Uses exclamation marks!"

  - colour: "Black"
    provider: "openrouter"
    model: "openchat/openchat-7b:free"
    personality:
      name: "Observer"
      aggression: 0.2
      suspicion_tendency: 0.6
      chattiness: 0.3
      cooperation: 0.9
      deception_skill: 0.3
      risk_tolerance: 0.2
      speaking_style: "Quiet and observant. Only speaks when necessary."

  - colour: "Brown"
    provider: "openrouter"
    model: "google/gemini-2.0-flash-001"
    personality:
      name: "Follower"
      aggression: 0.3
      suspicion_tendency: 0.3
      chattiness: 0.6
      cooperation: 1.0
      deception_skill: 0.4
      risk_tolerance: 0.3
      speaking_style: "Agreeable and supportive. Often repeats what others say."

  - colour: "Pink"
    provider: "openrouter"
    model: "meta-llama/llama-3-8b-instruct:free"
    personality:
      name: "Instigator"
      aggression: 0.7
      suspicion_tendency: 0.8
      chattiness: 0.8
      cooperation: 0.4
      deception_skill: 0.6
      risk_tolerance: 0.7
      speaking_style: "Provocative and accusing. Likes to stir the pot."

  - colour: "Purple"
    provider: "openrouter"
    model: "google/gemini-2.0-flash-001"
    personality:
      name: "Logic"
      aggression: 0.4
      suspicion_tendency: 0.9
      chattiness: 0.6
      cooperation: 0.7
      deception_skill: 0.5
      risk_tolerance: 0.4
      speaking_style: "Logical and evidence-based. Focuses on facts."

  - colour: "White"
