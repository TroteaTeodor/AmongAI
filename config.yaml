game:
  mode: "watch_ai"            # "watch_ai", "play_with_ai", "chat_mode"
  num_players: 4
  num_impostors: 1
  discussion_time: 30
  voting_time: 30
  kill_cooldown: 15
  sabotage_cooldown: 45
  task_count: 8
  game_speed: 1.0

ai:
  decision_interval: 3.0      # Paid models have no harsh rate limits
  vision_radius: 500
  vision_radius_dark: 150
  max_concurrent_calls: 5     # Can be higher with paid models
  fallback_enabled: true
  task_duration_min: 2.0
  task_duration_max: 5.0
  idle_after_task_min: 0.5
  idle_after_task_max: 1.5

  default_provider: "openrouter"
  default_model: "google/gemini-2.0-flash-001"

providers:
  openrouter:
    api_key: "${OPENROUTER_API_KEY}"
    model: "google/gemini-2.0-flash-001"
    
  # Other providers kept for reference
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    model: "claude-3-5-sonnet-20241022"
  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4o-mini"

players:
  - colour: "Red"
    provider: "openrouter"
    model: "deepseek/deepseek-chat-v3-0324"
    personality:
      name: "Commander"
      aggression: 0.6
      suspicion_tendency: 0.7
      chattiness: 0.8
      cooperation: 0.5
      deception_skill: 0.7
      risk_tolerance: 0.6
      speaking_style: "Direct and authoritative. Uses short declarative sentences."

  - colour: "Blue"
    provider: "openrouter"
    model: "mistralai/mistral-nemo"
    personality:
      name: "Detective"
      aggression: 0.3
      suspicion_tendency: 0.9
      chattiness: 0.7
      cooperation: 0.8
      deception_skill: 0.4
      risk_tolerance: 0.3
      speaking_style: "Analytical and methodical. Often asks probing questions."

